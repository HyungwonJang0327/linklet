# 리포 전체 시크릿 스캔 (PUBLIC 리포). pre-commit 훅(.githooks/pre-commit)과 이중으로 막는다.
# 오탐은 .gitleaksignore 에 fingerprint로만 추가한다. 실제 시크릿은 폐기·교체한다.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # PR에 탐지 결과 코멘트

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
