# v2 품질 게이트: PR마다 lint · format · typecheck · test(커버리지) · build, 그리고 별도 잡으로 E2E(Playwright)
# decisions/testing.md, CLAUDE.md §7
name: v2 CI

# 경로 필터 없음: quality 가 main 보호의 필수 체크라, 필터가 있으면 문서만 바꾼 PR이 영원히 대기한다
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v2

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # 통합 테스트용 Postgres (decisions/testing.md T5·T10). 값은 v2/docker-compose.yml db-test 와 같은 더미 고정값 — 시크릿 아님.
      # 호스트 포트 5434 로 노출하면 vitest.setup.ts 가 덮는 테스트 DB 주소(127.0.0.1:5434/linklet_test)와 그대로 맞고,
      # vitest.global-setup.mts 가 TCP 로 닿는 것을 확인한 뒤 `prisma migrate deploy` 를 적용한다. 추가 단계 없음.
      # 잡은 러너 호스트에서 돌고(container 아님) service 포트가 localhost 에 매핑된다. GitHub 은 health 통과 후 steps 를 시작한다
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linklet
          POSTGRES_PASSWORD: linklet
          POSTGRES_DB: linklet_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U linklet -d linklet_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
        env:
          # 테스트 DB(service container)에 닿지 않으면 skip 이 아니라 실패 — vitest.global-setup.mts
          LINKLET_REQUIRE_TEST_DB: "1"
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # 빌드용 더미 env — 시크릿 아님. `next build` 는 route 모듈을 평가하며 shared/config/env 의 부팅 검증(F01)을 돌리는데
          # CI 에는 env 가 없어 첫 route(/api/health, 2026-11-15)부터 실패했다. 빌드는 DB 에 붙지 않는다(닫힌 포트 5999 로 로컬 확인).
          # build 는 NODE_ENV=production 이라 server/db.ts 의 TLS 가드가 sslmode=verify-full 을 요구한다(db-config.assertTlsInProduction)
          NEXT_PUBLIC_APP_URL: http://localhost:3002
          DATABASE_URL: postgresql://build:build@127.0.0.1:5999/linklet_build?sslmode=verify-full
          DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:5999/linklet_build?sslmode=verify-full
          # 인증 필수 키(F08) — 빌드용 더미, 시크릿 아님. 빌드는 Google 에 가지 않는다
          BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-not-a-real-secret
          GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.example
          GOOGLE_CLIENT_SECRET: ci-build-only-google-client-secret

  e2e:
    # v2 E2E (decisions/testing.md T1 핵심 흐름, planning 완료 기준 5). quality 와 병렬 — 서로 기다리지 않아 PR 피드백이 빠르고,
    # 한쪽이 깨져도 다른 쪽 결과를 볼 수 있다. 기준선 project(e2e/baseline, T7·T8)는 CI 에서 돌지 않는다 —
    # playwright.config.ts 가 CI=1 이면 BASELINE 플래그를 무시하고 chromium project 만 남긴다
    # (CI=true 는 GitHub Actions 기본 env → retries 2·workers 1·github reporter·reuseExistingServer 꺼짐도 같은 분기)
    # 서버는 playwright.config.ts 의 webServer 가 `pnpm build && pnpm start -p 3002` 로 띄운다. env(더미 DB·LINKLET_E2E=1)도 거기 고정 —
    # 여기서 따로 주지 않는다. DB 는 닫힌 포트 더미라 /api/health 는 503 경로로 통과한다. DB 가 필요한 E2E 의 시드 DB 연결은
    # F13 이후 별도 결정(todo/tester-todo.md)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # chromium 만(playwright.config.ts projects 와 일치). --with-deps 로 러너에 시스템 라이브러리까지 설치한다
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # 실패 분석용 HTML 리포트(trace 는 on-first-retry 라 재시도부터 포함). 성공 시에는 올리지 않는다
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: v2/playwright-report/
          retention-days: 7
