# v2 품질 게이트: PR마다 lint · format · typecheck · test(커버리지) · build
# decisions/testing.md, CLAUDE.md §7
name: v2 CI

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v2

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
