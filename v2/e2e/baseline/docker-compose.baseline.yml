# 기존 앱 기준선 E2E 전용 Postgres (decisions/testing.md T8)
# - 로컬 전용·CI 제외. 운영·dev(Neon) DB와 물리적으로 분리된 버리는 DB
# - 접속 정보는 더미 고정값. 시크릿이 아니며 운영 값과 혼동되지 않게 'baseline' 접두사
# - 데이터는 tmpfs: 컨테이너가 내려가면 사라진다
# - 호스트 포트 54329: v2 로컬 DB(5432/5433 예정)와 겹치지 않게
name: linklet-baseline

services:
  db:
    image: postgres:17-alpine
    container_name: linklet-baseline-db
    environment:
      POSTGRES_USER: ${BASELINE_DB_USER:-baseline}
      POSTGRES_PASSWORD: ${BASELINE_DB_PASSWORD:-baseline}
      POSTGRES_DB: ${BASELINE_DB_NAME:-linklet_baseline}
    ports:
      - '127.0.0.1:${BASELINE_DB_PORT:-54329}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 1s
      timeout: 3s
      retries: 30
