<!DOCTYPE html>
<html>
<head>
    <title>Test Metadata Extraction</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        input[type="url"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Metadata Extraction</h1>
        <div class="form-group">
            <label for="url">Product URL:</label>
            <input type="url" id="url" placeholder="Enter a product URL" value="https://github.com">
        </div>
        <div class="form-group">
            <button id="extract" onclick="extractMetadata()">Extract Metadata</button>
        </div>
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        async function extractMetadata() {
            const url = document.getElementById('url').value;
            const button = document.getElementById('extract');
            const result = document.getElementById('result');
            
            if (!url) {
                alert('Please enter a URL');
                return;
            }
            
            button.disabled = true;
            button.textContent = 'Extracting...';
            result.style.display = 'none';
            
            try {
                const response = await fetch('http://localhost:3001/api/metadata', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                
                if (data.success && data.data) {
                    result.innerHTML = `
                        <div class="success">
                            <h3>✅ Metadata Extracted Successfully</h3>
                            <p><strong>Title:</strong> ${data.data.title || 'N/A'}</p>
                            <p><strong>Description:</strong> ${data.data.description || 'N/A'}</p>
                            <p><strong>Price:</strong> ${data.data.price || 'N/A'}</p>
                            <p><strong>Site Name:</strong> ${data.data.siteName || 'N/A'}</p>
                            <p><strong>Image URL:</strong> ${data.data.imageUrl ? `<a href="${data.data.imageUrl}" target="_blank">View Image</a>` : 'N/A'}</p>
                            ${data.data.imageUrl ? `<img src="${data.data.imageUrl}" alt="Product Image" style="max-width: 200px; margin-top: 10px;">` : ''}
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">
                            <h3>❌ Extraction Failed</h3>
                            <p>${data.error || 'Unknown error'}</p>
                        </div>
                    `;
                }
                
                result.style.display = 'block';
                
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                result.style.display = 'block';
            } finally {
                button.disabled = false;
                button.textContent = 'Extract Metadata';
            }
        }
    </script>
</body>
</html>
